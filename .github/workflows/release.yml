name: release

on:
  release:
    types:
      - released
      - prereleased

concurrency:
  group: ${{ github.workflow }}-${{ github.event.release.tag_name }}
  cancel-in-progress: false

jobs:
  goreleaser:
    name: build & upload artifacts
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ github.event.release.tag_name }}

      - uses: actions/setup-go@v6
        with:
          go-version-file: "go.mod"

      - uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: v2.15.4
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  publish-npm:
    needs: goreleaser
    if: github.event.action == 'released'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    env:
      VERSION: ${{ github.event.release.tag_name }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org/

      # The git tag carries a leading "v" (e.g. v1.2.3); npm package versions must be
      # plain semver. Keep the tag for the GitHub download, strip the "v" for package.json.
      - name: Resolve npm version
        run: echo "NPM_VERSION=${VERSION#v}" >> "$GITHUB_ENV"

      - name: Download release binaries
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p dist-bin
          gh release download "$VERSION" \
            --repo "$GITHUB_REPOSITORY" \
            --dir dist-bin \
            --pattern 'zcli-linux-amd64' \
            --pattern 'zcli-linux-i386' \
            --pattern 'zcli-darwin-amd64' \
            --pattern 'zcli-darwin-arm64' \
            --pattern 'zcli-win-x64.exe'

      - name: Build platform packages
        run: |
          node tools/npm/scripts/build-platform-packages.mjs \
            --binaries "$GITHUB_WORKSPACE/dist-bin" \
            --version "$NPM_VERSION" \
            --out "$GITHUB_WORKSPACE/dist-npm"

      # Platform packages must be published before the main package, otherwise its
      # optionalDependencies can't be resolved on install.
      - name: Publish platform packages
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          for dir in "$GITHUB_WORKSPACE"/dist-npm/*/; do
            npm publish "$dir" --access=public
          done

      - name: Publish main package
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          cd tools/npm
          npm i -g replace-in-files-cli@2.2.0
          replace-in-files --string='v0.0.0-zerops' --replacement="$NPM_VERSION" package.json
          npm publish --access=public --ignore-scripts

  report:
    needs: goreleaser
    if: github.event.action == 'released'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Notify discord about new release
        uses: sarisia/actions-status-discord@v1.16.0
        with:
          webhook: ${{ secrets.DISCORD_WEBHOOK }}
          title: "New version of `zcli` is ready!"
          nocontext: 'true'
          description: |
            Version `${{ github.event.release.tag_name }}`
            Changelog [here](${{ github.event.release.html_url }})
          color: 0xff91a4
          username: GitHub
