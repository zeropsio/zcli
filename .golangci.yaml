version: "2"

run:
  timeout: 10m
  concurrency: 16
  issues-exit-code: 1
  tests: true

output:
  formats:
    text:
      path: stdout
      colors: true

linters:
  default: none
  enable:
    - asasalint
    - bodyclose
    - containedctx
    - contextcheck
    - dogsled
    - dupword
    - durationcheck
    - errcheck
    - errchkjson
    - errname
    - errorlint
    - exhaustive
    - forcetypeassert
    - gocheckcompilerdirectives
    - gocritic
    - godox
    - goprintffuncname
    - gosmopolitan
    - govet
    - ineffassign
    - maintidx
    - makezero
    - mirror
    - misspell
    - musttag
    - nakedret
    - nilerr
    - noctx
    - predeclared
    - reassign
    - staticcheck
    - tagalign
    - testableexamples
    - testifylint
    - thelper
    - tparallel
    - unconvert
    - unparam
    - unused
    - usestdlibvars
    - usetesting
    - wastedassign
    - whitespace
    - depguard
  settings:
    depguard:
      rules:
        # src/entity is the zcli domain layer and must not depend on zerops-go.
        # All conversion between domain types and zerops-go wire types lives in
        # src/entity/repository (which this rule does not cover). Keeping the
        # domain free of zerops-go is the whole point of the boundary.
        entity-domain-pure:
          files:
            - "**/src/entity/*.go"
          deny:
            - pkg: github.com/zeropsio/zerops-go
              desc: src/entity is the domain boundary - keep zerops-go types in src/entity/repository and convert there.
        # cliStorage persists domain types; it must not reach for zerops-go.
        storage-domain-pure:
          files:
            - "**/src/cliStorage/*.go"
          deny:
            - pkg: github.com/zeropsio/zerops-go
              desc: cliStorage persists zcli domain types - do not import zerops-go here.
    godox:
      keywords:
        - FIXME
    errcheck:
      # Exclude write/print/close patterns where the error is conventionally
      # ignored: strings.Builder / bytes.Buffer never error; fmt.Fprint* on
      # printers/log writers is fire-and-forget; deferred Close on read-only
      # files has nothing meaningful to do with the error.
      exclude-functions:
        - (*strings.Builder).WriteString
        - (*strings.Builder).WriteByte
        - (*strings.Builder).WriteRune
        - (*bytes.Buffer).WriteString
        - (*bytes.Buffer).WriteByte
        - (*bytes.Buffer).WriteRune
        - fmt.Fprint
        - fmt.Fprintf
        - fmt.Fprintln
        - (io.Closer).Close
        - (*os.File).Close
        - os.Remove
    maintidx:
      # A high index indicates better maintainability (it's kind of the opposite of complexity).
      under: 15 # Default: 20
  exclusions:
    rules:
      # QF1008 "could remove embedded field from selector" is cosmetic.
      # ST1001 "should not use dot imports" is intentional in showcase/main.go.
      - linters: [staticcheck]
        text: "(QF1008|ST1001):"
      # defer x.Close() on gzip/tar writers, ws conns, etc. — concrete types
      # implementing io.Closer that errcheck's interface exclude won't match.
      - linters: [errcheck]
        source: "^\\s*defer .+\\.Close\\(\\)"
      # These sentinels match exact stderr output from wireguard/ip; lowering
      # them would break string comparisons.
      - linters: [staticcheck]
        path: src/cmdRunner/run.go
        text: "ST1005:"
      # Integration tests marshal internal persisted structs (e.g.
      # cliStorage.Data) to seed on-disk state. Those types intentionally rely
      # on Go's default field-name JSON keys, so don't require explicit tags.
      - linters: [musttag]
        path: _test\.go$

issues:
  max-same-issues: 0

formatters:
  enable:
    - gofmt
    - goimports
