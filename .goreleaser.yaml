version: 2

project_name: zcli

builds:
  - id: linux-amd64
    main: ./cmd/zcli/main.go
    binary: zcli-linux-amd64
    goos: [linux]
    goarch: [amd64]
    env:
      - CGO_ENABLED=0
    flags: [-trimpath]
    ldflags:
      - -s -w -X github.com/zeropsio/zcli/src/version.version={{ .Tag }}

  - id: linux-386
    main: ./cmd/zcli/main.go
    binary: zcli-linux-i386
    goos: [linux]
    goarch: ["386"]
    env:
      - CGO_ENABLED=0
    flags: [-trimpath]
    ldflags:
      - -s -w -X github.com/zeropsio/zcli/src/version.version={{ .Tag }}

  - id: darwin-amd64
    main: ./cmd/zcli/main.go
    binary: zcli-darwin-amd64
    goos: [darwin]
    goarch: [amd64]
    env:
      - CGO_ENABLED=0
    flags: [-trimpath]
    ldflags:
      - -s -w -X github.com/zeropsio/zcli/src/version.version={{ .Tag }}

  - id: darwin-arm64
    main: ./cmd/zcli/main.go
    binary: zcli-darwin-arm64
    goos: [darwin]
    goarch: [arm64]
    env:
      - CGO_ENABLED=0
    flags: [-trimpath]
    ldflags:
      - -s -w -X github.com/zeropsio/zcli/src/version.version={{ .Tag }}

  - id: windows-amd64
    main: ./cmd/zcli/main.go
    binary: zcli-win-x64
    goos: [windows]
    goarch: [amd64]
    env:
      - CGO_ENABLED=0
    flags: [-trimpath]
    ldflags:
      - -s -w -X github.com/zeropsio/zcli/src/version.version={{ .Tag }}

  # Deb-only builds: binary is named "zcli" so the package installs
  # /usr/local/bin/zcli rather than the arch-suffixed name the archives
  # and npm wrapper rely on.
  - id: deb-amd64
    main: ./cmd/zcli/main.go
    binary: zcli
    goos: [linux]
    goarch: [amd64]
    env:
      - CGO_ENABLED=0
    flags: [-trimpath]
    ldflags:
      - -s -w -X github.com/zeropsio/zcli/src/version.version={{ .Tag }}

  - id: deb-386
    main: ./cmd/zcli/main.go
    binary: zcli
    goos: [linux]
    goarch: ["386"]
    env:
      - CGO_ENABLED=0
    flags: [-trimpath]
    ldflags:
      - -s -w -X github.com/zeropsio/zcli/src/version.version={{ .Tag }}

archives:
  - id: raw
    ids: [linux-amd64, linux-386, darwin-amd64, darwin-arm64, windows-amd64]
    formats: [binary]
    name_template: >-
      {{- if eq .Os "windows" -}}zcli-win-x64
      {{- else if and (eq .Os "linux") (eq .Arch "386") -}}zcli-linux-i386
      {{- else -}}zcli-{{ .Os }}-{{ .Arch }}
      {{- end -}}

  - id: npm
    ids: [linux-amd64, linux-386, darwin-amd64, darwin-arm64, windows-amd64]
    formats: [tar.gz]
    wrap_in_directory: builds
    files:
      - none*
    name_template: >-
      {{- if eq .Os "windows" -}}zcli-win-x64.exe-npm
      {{- else if and (eq .Os "linux") (eq .Arch "386") -}}zcli-linux-i386-npm
      {{- else -}}zcli-{{ .Os }}-{{ .Arch }}-npm
      {{- end -}}

nfpms:
  - id: deb
    package_name: zcli
    ids: [deb-amd64, deb-386]
    maintainer: "Zerops <https://zerops.io>"
    description: "Zerops CLI"
    homepage: "https://github.com/zeropsio/zcli"
    formats: [deb]
    bindir: /usr/local/bin
    file_name_template: >-
      zcli_{{ .Tag }}_{{ if eq .Arch "386" }}i386{{ else }}{{ .Arch }}{{ end }}

checksum:
  name_template: "checksums.txt"

release:
  mode: append
  prerelease: auto

changelog:
  disable: true
